#  Builds the desktop app on each OS and attaches the installers to a release.
#
#  PyInstaller cannot cross-compile, so each artefact is produced on a runner
#  of its own platform: the Windows installer on windows-latest, the Apple
#  silicon .dmg on macos-14, the Intel .dmg on macos-13.
#
#  Run it from the Actions tab, or push a tag like v0.1.0 to cut a release.

name: build desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag (blank = build only)"
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Intel macOS is allowed to fail without blocking the release: Apple has
    # discontinued the architecture and llvmlite no longer publishes an
    # x86_64 macOS wheel, so pip falls back to building LLVM from source.
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x86_64
            artifact: windows
          # macos-13 and macos-14 are both retired (Dec 2025 / Nov 2026).
          # arm64 = macos-15; Intel = macos-15-intel, which Apple and GitHub
          # have both marked as going away, so Intel builds have a shelf life.
          - os: macos-15
            label: macOS arm64 (Apple silicon)
            artifact: macos-arm64
          - os: macos-15-intel
            label: macOS x86_64 (Intel)
            artifact: macos-x86_64
            optional: true
          - os: ubuntu-24.04
            label: Linux x86_64
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,build]"

      # A native window is nicer than the browser, but pywebview drags in
      # platform GUI bindings that can fail to install or to bundle. The app
      # falls back to the default browser on its own, so a failure here must
      # not fail the build.
      - name: Native window support (optional)
        continue-on-error: true
        run: pip install pywebview

      # pywebview needs GTK/WebKit on Linux; Windows and macOS use the
      # system webview and need nothing extra.

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      # 0.1.0 shipped an app that died on launch in the windowed build:
      # no console means sys.stdout is None, and uvicorn's log formatter
      # calls .isatty() on it. Launching through a pipe hides this, so the
      # end-to-end check below cannot see it -- this one reproduces it.
      - name: Windowed-mode regression test
        run: python packaging/test_windowed.py

      - name: Build and package
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: python packaging/build.py --package

      # build.py already ran the frozen binary's self-test; this additionally
      # proves it serves and docks before anything is published.
      - name: End-to-end check
        run: python packaging/ci_check.py

      - uses: actions/upload-artifact@v4
        with:
          name: pydock-${{ matrix.artifact }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    # Either a pushed tag, or a manual run that named a tag.  The runner's
    # own GITHUB_TOKEN creates the tag and the release, which is what makes
    # this work from an environment that cannot push tags itself.
    # always(): a platform that could not build -- or could not get a runner
    # -- must not hold back the installers that did build. The release is
    # updated in place when a later run adds the missing one.
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: What was built
        run: ls -la artifacts/ && du -h artifacts/* | sort -h

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: pydock ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            Desktop builds of pydock.

            | Platform | File |
            |---|---|
            | Windows 10/11 | `pydock-*-windows-x86_64-setup.exe` |
            | Windows, no install | `pydock-*-windows-x86_64-portable.zip` |
            | macOS, Apple silicon | `pydock-*-macos-arm64.dmg` |
            | macOS, Intel | `pydock-*-macos-x86_64.dmg` |
            | Linux | `pydock-*-linux-x86_64.tar.gz` |

            Apple silicon Macs use the `arm64` disk image. Intel Macs are
            not currently built: `llvmlite` has no x86_64 macOS wheel any
            more, so that build needs a conda-based toolchain.

            These builds are **not code-signed**. Windows SmartScreen will
            warn: choose *More info*, then *Run anyway*. macOS Gatekeeper
            will refuse a double-click: right-click the app and choose
            *Open*, or run
            `xattr -dr com.apple.quarantine /Applications/pydock.app`.

            Everything runs on your machine. No structure is uploaded anywhere.
